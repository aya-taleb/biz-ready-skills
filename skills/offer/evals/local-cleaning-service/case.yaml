schema_version: "1.1"
name: local-cleaning-service
expected_outcome: |
  Objections from what the founder heard (trust after a bad cleaner, commitment). Pieces such as a re-clean guarantee within a window, a first clean without a contract, a named cleaner, a pause option; costs per job or placeholders; urgency only if real (e.g. limited weekly slots if true, else none); name; offer written for the buyer; a test with a pass line.
